<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Happy or Sad Face Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 30px 16px; }
        .stage { position: relative; width: 400px; height: 300px; margin: 0 auto; border: 4px solid #333; border-radius: 8px; background: #000; overflow: hidden; }
        #annotated { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
        #webcam { display: none; }
        .buttons { margin-top: 16px; }
        button, .file-btn { font-size: 16px; padding: 10px 16px; border: 0; border-radius: 6px; background: #333; color: #fff; cursor: pointer; margin: 4px; }
        button:disabled { background: #999; cursor: default; }
        input[type=file] { display: none; }
        #result { font-size: 20px; font-weight: bold; margin-top: 20px; color: #333; min-height: 28px; }
        @media (max-width: 480px) { .stage { width: 90vw; height: 67.5vw; } }
    </style>
</head>
<body>
    <h1>Happy or Sad Face Classifier</h1>

    <div class="stage">
        <video id="webcam" autoplay playsinline muted></video>
        <img id="annotated" alt="Annotated prediction">
    </div>

    <div class="buttons">
        <button id="btnWebcam">Use webcam</button>
        <label class="file-btn" for="fileInput">Upload photo</label>
        <input type="file" id="fileInput" accept="image/*">
        <button id="btnStop">Stop</button>
    </div>

    <div id="result">Click "Use webcam" or "Upload photo" to start.</div>

    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <script>
        const WEBCAM_PAUSE_MS = 100;     // short pause between live frames; inference time dominates
        const WEBCAM_JPEG_QUALITY = 0.6; // lower = smaller upload = faster
        const UPLOAD_MAX_SIDE = 1024;    // large photos are shrunk before upload

        const video = document.getElementById('webcam');
        const annotated = document.getElementById('annotated');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');
        const btnWebcam = document.getElementById('btnWebcam');
        const btnStop = document.getElementById('btnStop');
        const fileInput = document.getElementById('fileInput');

        let liveOn = false;   // webcam loop running
        let busy = false;     // a /predict request is in flight

        function setStatus(text) { resultDiv.innerText = text; }

        async function predict(dataUrl) {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataUrl })
            });
            const data = await response.json();
            if (!response.ok || data.error) {
                throw new Error(data.error || response.statusText);
            }
            return data;
        }

        function showResult(data) {
            if (data.image) {
                annotated.src = data.image;
                annotated.style.display = 'block';
            }
            const preds = (data.predictions && data.predictions.predictions) || [];
            const top = data.predictions && data.predictions.top;
            const best = preds.find(p => p.class === top);
            return best ? `${top} (${Math.round(best.confidence * 100)}%)` : 'No face detected';
        }

        // ---- Webcam mode ----
        async function liveTick() {
            if (!liveOn) return;
            if (busy) { setTimeout(liveTick, 50); return; }
            busy = true;
            const started = performance.now();
            try {
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = await predict(canvas.toDataURL('image/jpeg', WEBCAM_JPEG_QUALITY));
                const label = showResult(data);
                setStatus(`${label}  (${Math.round(performance.now() - started)} ms)`);
            } catch (err) {
                console.error(err);
                setStatus('Error: ' + err.message);
            } finally {
                busy = false;
                if (liveOn) setTimeout(liveTick, WEBCAM_PAUSE_MS);
            }
        }

        async function startWebcam() {
            stopAll();
            try {
                if (!video.srcObject) {
                    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                    await video.play();
                }
            } catch (err) {
                setStatus('Webcam access denied or unavailable.');
                return;
            }
            liveOn = true;
            setStatus('Scanning face...');
            liveTick();
        }

        // ---- Upload mode ----
        function fileToResizedDataUrl(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const scale = Math.min(1, UPLOAD_MAX_SIDE / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale);
                    c.height = Math.round(img.height * scale);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    resolve(c.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
                img.src = url;
            });
        }

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            if (!file) return;
            stopAll();
            setStatus('Analyzing photo...');
            try {
                const dataUrl = await fileToResizedDataUrl(file);
                const data = await predict(dataUrl);
                setStatus(showResult(data));
            } catch (err) {
                console.error(err);
                setStatus('Error: ' + err.message);
            } finally {
                fileInput.value = '';   // allow choosing the same file again
            }
        });

        // ---- Controls ----
        function stopAll() {
            liveOn = false;
            annotated.style.display = 'none';
        }

        btnWebcam.addEventListener('click', startWebcam);
        btnStop.addEventListener('click', () => { stopAll(); setStatus('Stopped.'); });
    </script>
</body>
</html>
